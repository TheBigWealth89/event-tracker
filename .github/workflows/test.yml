name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Optional: We could use GH services, but since we have globalSetup using docker-compose, 
      # we'll let Jest handle the container startup/shutdown to match local env exactly.

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Compose
        run: |
          docker --version
          docker-compose --version

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          # Secrets are not needed for unit/local integration tests with local docker
